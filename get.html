<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Obter Script — Prisma Scripts</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(139, 92, 246, .18),
          transparent 45%
        ),
        #07070b;
    }

    .gate {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .gate-card {
      width: min(560px, 100%);
      padding: 34px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      text-align: center;
    }

    .gate-logo {
      display: inline-block;
      margin-bottom: 28px;
    }

    .gate-logo span,
    .gate-logo b {
      color: #a78bfa;
    }

    .gate-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(139,92,246,.13);
      border: 1px solid rgba(139,92,246,.25);
      color: #b9a5ff;
      font-size: 30px;
    }

    .gate-pill {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 100px;
      color: #b9a5ff;
      background: rgba(139,92,246,.08);
      border: 1px solid rgba(167,139,250,.25);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .gate-card h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .gate-card > p {
      color: #858591;
      font-size: 14px;
      line-height: 1.6;
    }

    .progress-box {
      height: 8px;
      margin-top: 28px;
      background: rgba(255,255,255,.06);
      border-radius: 100px;
      overflow: hidden;
    }

    #progress {
      display: block;
      width: 0%;
      height: 100%;
      background: #8b5cf6;
      border-radius: inherit;
      transition: width .5s ease;
    }

    #timer {
      margin-top: 14px;
      color: #a78bfa;
      font-size: 13px;
      font-weight: 700;
    }

    #scriptBox {
      display: none;
      margin-top: 26px;
      text-align: left;
    }

    .script-label {
      color: #a78bfa;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 9px;
      display: block;
    }

    #scriptText {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      resize: none;
      outline: none;
      color: #ddd;
      background: #050507;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 13px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    #copyScript {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    #copyScript:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(139,92,246,.25);
    }

    #copyStatus {
      text-align: center;
      margin-top: 10px;
      color: #9b7aff;
      font-size: 12px;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #777784;
      font-size: 13px;
      transition: .2s;
    }

    .back-link:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .gate-card {
        padding: 25px 18px;
      }

      .gate-card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      <span>✦</span> PRISMA <b>SCRIPTS</b>
    </a>

    <div class="nav-links">
      <a href="index.html#scripts">Scripts</a>
      <a href="index.html#executores">Executores</a>
      <a href="index.html#updates">Updates</a>
    </div>

  </nav>


  <main class="gate">

    <div class="gate-card">

      <a href="index.html" class="logo gate-logo">
        <span>✦</span> PRISMA <b>SCRIPTS</b>
      </a>


      <div id="icon" class="gate-icon">
        ⚡
      </div>


      <div class="gate-pill">
        LINK PROTEGIDO
      </div>


      <h1 id="title">
        Preparando seu script
      </h1>


      <p id="msg">
        Aguarde alguns segundos para liberar o acesso.
      </p>


      <div class="progress-box">
        <i id="progress"></i>
      </div>


      <div id="timer">
        5s
      </div>


      <!-- SCRIPT LIBERADO -->

      <div id="scriptBox">

        <span class="script-label">
          PRISMA SCRIPT
        </span>

        <textarea
          id="scriptText"
          readonly
        ></textarea>

        <button id="copyScript">
          📋 Copiar Script
        </button>

        <p id="copyStatus"></p>

      </div>


      <a href="index.html" class="back-link">
        ← Voltar para a biblioteca
      </a>

    </div>

  </main>


  <script src="gate.js"></script>

</body>

</html>
