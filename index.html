<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prisma Scripts</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050508;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* FUNDO */

    .glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: .15;
      pointer-events: none;
      z-index: -1;
    }

    .glow1 {
      background: #7c3aed;
      top: -200px;
      left: -150px;
    }

    .glow2 {
      background: #9333ea;
      right: -200px;
      top: 500px;
    }

    /* NAV */

    nav {
      width: min(1150px, calc(100% - 30px));
      height: 75px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .logo {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #a78bfa;
    }

    .logo b {
      color: #a78bfa;
    }

    .navlinks {
      display: flex;
      gap: 25px;
    }

    .navlinks a {
      color: #9999a6;
      font-size: 13px;
    }

    .navlinks a:hover {
      color: white;
    }

    /* HERO */

    .hero {
      width: min(900px, calc(100% - 30px));
      margin: auto;
      text-align: center;
      padding: 100px 0 70px;
    }

    .pill {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 50px;
      border: 1px solid rgba(167,139,250,.3);
      background: rgba(139,92,246,.08);
      color: #b9a5ff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .hero h1 {
      margin-top: 25px;
      font-size: clamp(48px, 10vw, 90px);
      line-height: .9;
      letter-spacing: -4px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #9b7aff;
    }

    .hero p {
      max-width: 550px;
      margin: 25px auto;
      color: #92929f;
      line-height: 1.7;
      font-size: 15px;
    }

    .mainbutton {
      display: inline-flex;
      gap: 20px;
      align-items: center;
      padding: 15px 20px;
      background: #8b5cf6;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      transition: .2s;
    }

    .mainbutton:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(139,92,246,.3);
    }

    /* PESQUISA */

    .searcharea {
      width: min(800px, calc(100% - 30px));
      margin: auto;
    }

    .searchbox {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
    }

    .searchbox span {
      font-size: 23px;
      color: #777783;
    }

    .searchbox input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    .searchbox input::placeholder {
      color: #666672;
    }

    /* CATEGORIAS */

    .categories {
      width: min(1150px, calc(100% - 30px));
      margin: 25px auto 70px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .category {
      white-space: nowrap;
      padding: 9px 15px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.025);
      color: #9999a6;
      cursor: pointer;
    }

    .category.active,
    .category:hover {
      background: rgba(139,92,246,.18);
      border-color: rgba(139,92,246,.4);
      color: white;
    }

    /* CONTAINER */

    .container {
      width: min(1150px, calc(100% - 30px));
      margin: auto;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 25px;
    }

    .heading small {
      color: #9278df;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .heading h2 {
      margin-top: 8px;
      font-size: 26px;
    }

    .heading > span {
      color: #666672;
      font-size: 12px;
    }

    /* SCRIPT */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      padding: 25px;
      min-height: 230px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(139,92,246,.4);
    }

    .cardicon {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(139,92,246,.14);
      font-size: 21px;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 9px;
    }

    .card p {
      color: #858591;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
