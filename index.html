<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prisma Scripts</title>

  <style>
    body {
      margin: 0;
      background: #07070b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #a78bfa;
    }

    .search {
      max-width: 600px;
      margin: 30px auto;
    }

    input {
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
      background: #111116;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      outline: none;
    }

    .card {
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      background: #111116;
      border: 1px solid #292932;
      border-radius: 15px;
    }

    button, .download {
      display: inline-block;
      padding: 12px 18px;
      margin-top: 10px;
      background: #8b5cf6;
      color: white;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .executor {
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <h1>✦ PRISMA SCRIPTS</h1>

  <div class="search">
    <input
      id="search"
      type="text"
      placeholder="Pesquisar scripts..."
    >
  </div>

  <div id="scripts">

    <div class="card">
      <h2>⚡ Script Roube um Ovo</h2>
      <p>Script para Roube um Ovo.</p>
      <a class="download" href="get.html?to=script-roube-um-ovo">
        Obter Script →
      </a>
    </div>

  </div>

  <!-- EXECUTORES -->

  <div class="card executor">

    <h2>⚡ Executores</h2>

    <p>
      Escolha o executor compatível com seu dispositivo.
    </p>

    <a
      class="download"
      href="https://www.mediafire.com/file/pfn3jfumf35quib/Delta-2.735.1138.apk/file"
      target="_blank"
    >
      📱 Mobile
    </a>

    <a
      class="download"
      href="https://realexecutor.com/download.html"
      target="_blank"
    >
      🖥️ PC
    </a>

  </div>

  <script>

    const pesquisa = document.getElementById("search");
    const scripts = document.getElementById("scripts");

    pesquisa.addEventListener("input", function() {

      const texto = pesquisa.value.toLowerCase();

      const script = scripts.querySelector(".card");

      if (script) {

        const nome = script.innerText.toLowerCase();

        script.style.display =
          nome.includes(texto) ? "block" : "none";

      }

    });

  </script>

</body>
</html>
